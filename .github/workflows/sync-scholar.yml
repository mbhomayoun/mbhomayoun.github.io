name: Auto-Sync Academic Publications (OpenAlex / ORCID)

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync publications from OpenAlex API
        run: |
          python3 - << 'EOF'
          import json, urllib.request, datetime

          cms_path = "public/data/cms-content.json"
          with open(cms_path, "r", encoding="utf-8") as f:
              cms = json.load(f)

          author_id = cms.get("openAlexAuthorId") or "A5120058838"
          url = f"https://api.openalex.org/works?filter=author.id:{author_id}&sort=publication_year:desc&per-page=50"
          req = urllib.request.Request(url, headers={"User-Agent": "mailto:mb.homayoun@aut.ac.ir"})

          with urllib.request.urlopen(req, timeout=20) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          synced = []
          for w in data.get("results", []):
              title = w.get("title") or ""
              if not title:
                  continue
              inv = w.get("abstract_inverted_index") or {}
              words = {}
              for word, positions in inv.items():
                  for pos in positions:
                      words[pos] = word
              abstract = " ".join(words[k] for k in sorted(words.keys())) if words else "Indexed via OpenAlex automated sync."
              src = ((w.get("primary_location") or {}).get("source") or {}).get("display_name") or "Indexed Repository"
              doi_raw = w.get("doi") or ""
              doi = doi_raw.replace("https://doi.org/", "") if doi_raw else "OpenAlex"
              authors = ", ".join(a["author"]["display_name"] for a in w.get("authorships", []))
              year = w.get("publication_year") or 2026
              wtype = "Preprint" if w.get("type") == "preprint" else ("Book" if w.get("type") == "book" else "Journal")
              topics = [c.get("display_name") for c in (w.get("concepts") or [])[:3] if c.get("display_name")] or ["Petroleum Engineering"]
              slug = (w.get("id") or title).split("/")[-1]
              bibtex = f"@article{{{slug},\n  title={{{title}}},\n  author={{{authors}}},\n  journal={{{src}}},\n  year={{{year}}},\n  doi={{{doi}}}\n}}"

              synced.append({
                  "id": f"oa-{slug}",
                  "title": title,
                  "authors": authors,
                  "venue": src,
                  "year": year,
                  "type": wtype,
                  "citations": int(w.get("cited_by_count") or 0),
                  "doi": doi,
                  "topics": topics,
                  "abstract": abstract[:900],
                  "keyFinding": f"Automatically synced from OpenAlex ({src}, {year}).",
                  "bibtex": bibtex,
                  "pdfUrl": doi_raw or (w.get("primary_location") or {}).get("landing_page_url") or "https://openalex.org/" + slug
              })

          cms["syncedPublications"] = synced
          cms["lastSyncedAt"] = datetime.datetime.utcnow().isoformat() + "Z"

          with open(cms_path, "w", encoding="utf-8") as f:
              json.dump(cms, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Synced {len(synced)} OpenAlex works.")
          EOF

      - name: Commit updated sync file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cms-content.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync publications from OpenAlex"
            git push
          else
            echo "No new publication updates."
          fi
